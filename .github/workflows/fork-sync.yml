name: Fork sync

# Rebases the fork's own commits onto the newest stable upstream tag, checks them, pushes main,
# keeps upstream workflows disabled, then builds and releases a self-signed macOS app. Every run,
# success or failure, ends by publishing its sync status for the app and the run summary. See FORK.md.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and release even when main already has a fork release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # The upstream this fork follows; the sync and status jobs both read it.
  UPSTREAM_URL: https://github.com/stablyai/orca.git
  # Holds status.json and the recorded base. The app reads it at the same name
  # (FORK_SYNC_STATUS_BRANCH in src/shared/fork/fork-sync-status.ts).
  FORK_SYNC_STATUS_BRANCH: fork-sync-status

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'saltyfireball/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
    outputs:
      changed: ${{ steps.rebase.outputs.changed }}
      released: ${{ steps.released.outputs.released }}
      upstream_tag: ${{ steps.tags.outputs.latest }}
      latest_sha: ${{ steps.tags.outputs.latest_sha }}
      base_sha: ${{ steps.tags.outputs.base_sha }}
      base_version: ${{ steps.tags.outputs.base_version }}
      base_source: ${{ steps.tags.outputs.base_source }}
      detect_state: ${{ steps.tags.outputs.state }}
      detect_error: ${{ steps.tags.outputs.detect_error }}
      old_main: ${{ steps.tags.outputs.old_main }}
      conflict: ${{ steps.rebase.outputs.conflict }}
      conflicts: ${{ steps.rebase.outputs.conflicts }}
      unsigned: ${{ steps.rebase.outputs.unsigned }}
      sha: ${{ steps.result.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Require the deploy key
        env:
          FORK_SYNC_DEPLOY_KEY: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}
        run: |
          if [ -z "$FORK_SYNC_DEPLOY_KEY" ]; then
            echo "::error::Actions secret FORK_SYNC_DEPLOY_KEY is empty. Add a write deploy key to $GITHUB_REPOSITORY and store its private key as FORK_SYNC_DEPLOY_KEY (FORK.md)."
            exit 1
          fi

      # GITHUB_TOKEN cannot push commits that touch .github/workflows; a write deploy key over SSH can.
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          ssh-key: ${{ secrets.FORK_SYNC_DEPLOY_KEY }}

      # Base detection and its reasoning live in the script (FORK.md "How sync works").
      - name: Find the newest stable upstream tag and the fork base
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          bash config/scripts/fork/fork-sync.sh detect

      # A rebase re-commits every fork commit; with this key they are SSH-signed by the fork owner.
      - name: Set up commit signing
        id: signing
        if: steps.tags.outputs.state == 'behind'
        shell: bash
        env:
          FORK_GIT_SIGNING_KEY: ${{ secrets.FORK_GIT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FORK_GIT_SIGNING_KEY" ]; then
            echo "::notice::FORK_GIT_SIGNING_KEY is empty, so the rebased commits stay unsigned (FORK.md)."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/git-signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          umask 077
          printf '%s\n' "$FORK_GIT_SIGNING_KEY" | tr -d '\r' >"$dir/key"
          chmod 600 "$dir/key"
          # Commit as the author of the newest fork commit, the fork owner, so no address lives here.
          name="$(git log -1 --format=%an HEAD)"
          email="$(git log -1 --format=%ae HEAD)"
          printf '%s namespaces="git" %s\n' "$email" "$(ssh-keygen -y -f "$dir/key")" >"$dir/allowed_signers"
          git config user.name "$name"
          git config user.email "$email"
          git config gpg.format ssh
          git config user.signingkey "$dir/key"
          git config gpg.ssh.allowedSignersFile "$dir/allowed_signers"
          git config commit.gpgsign true
          echo "enabled=true" >>"$GITHUB_OUTPUT"
          echo "Rebased commits will be signed and committed by $name."

      # On a conflict main is left as it was (the push below never runs); the status job reports it.
      - name: Rebase fork commits onto the newest tag
        id: rebase
        if: steps.tags.outputs.state == 'behind'
        shell: bash
        env:
          BASE_SHA: ${{ steps.tags.outputs.base_sha }}
          LATEST_SHA: ${{ steps.tags.outputs.latest_sha }}
          SIGNING: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "$SIGNING" != 'true' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
          bash config/scripts/fork/fork-sync.sh rebase

      # Straight after the rebase, so the key is gone before pnpm install runs package scripts.
      - name: Remove the signing key
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/git-signing"
          git config --unset commit.gpgsign || true
          git config --unset user.signingkey || true
          git config --unset gpg.ssh.allowedSignersFile || true

      # Mirrors release-mac-build.yml: "Setup pnpm" and "Setup Node.js".
      - name: Setup pnpm
        if: steps.rebase.outputs.changed == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        if: steps.rebase.outputs.changed == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.rebase.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.rebase.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Fork tests
        if: steps.rebase.outputs.changed == 'true'
        run: pnpm test src/shared/fork src/main/fork src/main/updater src/renderer/src/components/native-chat/fork config/scripts/fork --maxWorkers=2

      # Mirrors release-mac-build.yml: the install-mobile-dependencies action.
      - name: Install mobile dependencies
        if: steps.rebase.outputs.changed == 'true'
        uses: ./.github/actions/install-mobile-dependencies

      - name: Mobile typecheck
        if: steps.rebase.outputs.changed == 'true'
        working-directory: mobile
        run: pnpm typecheck

      # Disable what is registered now, so the push cannot start an upstream workflow already known.
      - name: Disable upstream workflows before the push
        if: steps.rebase.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash config/scripts/fork/fork-workflow-guard.sh disable

      - name: Push main
        if: steps.rebase.outputs.changed == 'true'
        env:
          OLD_MAIN: ${{ steps.tags.outputs.old_main }}
        run: git push --force-with-lease="main:$OLD_MAIN" origin HEAD:main

      # Upstream syncs bring new workflow files, which GitHub enables; only fork-sync may run here.
      - name: Keep upstream workflows disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash config/scripts/fork/fork-workflow-guard.sh disable

      # A workflow added by this push was active when the push landed and may have started.
      - name: Cancel upstream runs of the pushed commit
        if: steps.rebase.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash config/scripts/fork/fork-workflow-guard.sh cancel-runs "$(git rev-parse HEAD)"

      - name: Record the commit to build
        id: result
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      # M.m.(p*1000+N): N counts this upstream base's fork releases (config/scripts/fork/fork-version.mjs).
      # Worked out once here, so the app and the orcad template it ships carry the same version.
      - name: Compute the fork version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          upstream="$(node -p "require('./package.json').version")"
          version="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
            | node config/scripts/fork/fork-version.mjs "$upstream")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "Upstream $upstream, fork release $version"

      # A failed or skipped build would otherwise wait for the next upstream tag.
      - name: Check for a fork release of this commit
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.result.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tags_at_sha="$(git ls-remote --tags origin 'v*' \
            | awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' \
            | sort -u)"
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' | sort -u)"
          if [ -n "$tags_at_sha" ] && [ -n "$(comm -12 <(printf '%s\n' "$tags_at_sha") <(printf '%s\n' "$published"))" ]; then
            echo "released=true" >>"$GITHUB_OUTPUT"
            echo "$SHA already has a fork release"
          else
            echo "released=false" >>"$GITHUB_OUTPUT"
            echo "$SHA has no fork release yet"
          fi

  # As upstream's daily build does: every SSH host runs orcad, deployed from the template the app
  # ships. Without it the app has no server to install on an SSH host (SLRM-1758). This qualifies
  # every platform lane and keeps each lane's slot as an artifact of this run.
  orcad-template:
    needs: sync
    if: >-
      github.repository == 'saltyfireball/orca' &&
      (needs.sync.outputs.changed == 'true' || needs.sync.outputs.released != 'true' || inputs.force_build)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/node-server-tests.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
      build_template: true
      fast_runners: false

  # Upstream's desktop_template assembles the template with upstream's package.json version, so a
  # host would report 1.4.253 under a 1.4.253NNN app and look out of date. This assembles it again
  # from the same qualified lane slots, as desktop_template does, with the fork version stamped.
  orcad-template-fork:
    needs: [sync, orcad-template]
    if: github.repository == 'saltyfireball/orca' && needs.orcad-template.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/install-node-dependencies
      # Only this job's copy: build-orcad.mjs writes this version into the template's out/package.json.
      - name: Stamp the fork version
        env:
          FORK_VERSION: ${{ needs.sync.outputs.version }}
        run: npm pkg set "version=$FORK_VERSION"
      - name: Collect every lane's slot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: orcad-prebuild-*
          path: ${{ runner.temp }}/orcad-prebuild-lanes
      - name: Collect the Windows process-table addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orcad-windows-process-tree
          path: .build/windows-process-tree
      - name: Collect the Windows CLI launchers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orcad-windows-cli-launcher
          path: .build/windows-cli-launcher
      - name: Collect the Windows security addons
        if: hashFiles('config/scripts/native-build/windows/build-windows-security-addon.mjs', 'config/scripts/build-windows-security-addon.mjs') != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orcad-windows-security
          path: .build/windows-security
      - name: Merge the lanes and gate the full slot matrix
        shell: bash
        run: |
          node config/scripts/orcad-distribution/prebuilds/merge-orcad-prebuilds.mjs "$RUNNER_TEMP"/orcad-prebuild-lanes/*
          pnpm build:orcad-prebuilds --require-slots
          pnpm build:orcad-prebuilds --require-slots linux-x64-glibc217
      # The page the qualification lanes tested, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orcad-mobile-web-bundle
          path: out/mobile-web
      - run: pnpm build:orcad-template
      - name: Check the template carries the fork version
        env:
          FORK_VERSION: ${{ needs.sync.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          got="$(node -p "require('./out/orcad-template/out/package.json').version")"
          if [ "$got" != "$FORK_VERSION" ]; then
            echo "::error::orcad template has version $got, expected $FORK_VERSION"
            exit 1
          fi
          echo "orcad template version $got"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orcad-template-fork
          path: out/orcad-template/
          # The per-target .server-target and .runtime-node markers are dotfiles.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-mac:
    needs: [sync, orcad-template-fork]
    if: >-
      github.repository == 'saltyfireball/orca' &&
      needs.orcad-template-fork.result == 'success' &&
      (needs.sync.outputs.changed == 'true' || needs.sync.outputs.released != 'true' || inputs.force_build)
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      # Mirrors release-mac-build.yml job env: Vite's web build passes Node's default old-space ceiling.
      NODE_OPTIONS: --max-old-space-size=4096
      # No Apple identity: the fork signs with its own self-signed certificate (FORK.md, Signing),
      # named explicitly, so a stable designated requirement lets Squirrel.Mac accept each update.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_NAME: Orca Fork Code Signing
      FORK_MAC_CERT_SHA1: c5e8485cb550edea627fda93ead7cf1975ed3710
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.sync.outputs.sha }}

      # Mirrors release-mac-build.yml: "Setup pnpm" and "Setup Node.js".
      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      # The fork builds arm64 only (electron-builder.fork.config.cjs), so only arm64 natives are needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,arm64

      # Mirrors release-mac-build.yml: out/mobile-web needs mobile's React Native/Expo install.
      - uses: ./.github/actions/install-mobile-dependencies

      # Only this job's build copy: package.json in git keeps the upstream version.
      - name: Stamp the fork version
        env:
          FORK_VERSION: ${{ needs.sync.outputs.version }}
        run: npm pkg set "version=$FORK_VERSION"

      # A temporary keychain on the search list, trusted for code signing on this runner only:
      # electron-builder only signs with an identity `security find-identity -v` calls valid.
      - name: Import the fork signing identity
        env:
          CERT_P12_B64: ${{ secrets.FORK_MAC_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.FORK_MAC_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CERT_P12_B64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "::error::FORK_MAC_CERT_P12_B64 and FORK_MAC_CERT_PASSWORD must be set (Infisical /orca_fork)"
            exit 1
          fi
          dir="$RUNNER_TEMP/fork-signing"
          mkdir -p "$dir"
          keychain="$dir/fork-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf %s "$CERT_P12_B64" | base64 -D >"$dir/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$dir/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$CSC_NAME" -p "$keychain" >"$dir/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$dir/cert.pem"
          rm -f "$dir/cert.p12"
          security find-identity -v -p codesigning "$keychain"
          found="$(security find-identity -v -p codesigning "$keychain" | grep -ci "$FORK_MAC_CERT_SHA1" || true)"
          if [ "$found" != "1" ]; then
            echo "::error::The fork signing identity $FORK_MAC_CERT_SHA1 is not a valid code-signing identity"
            exit 1
          fi

      # electron-builder ships out/orcad-template as Contents/Resources/orcad-template.
      - name: Download the orcad deployment template
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orcad-template-fork
          path: out/orcad-template

      - name: Build app
        env:
          FORK_VERSION: ${{ needs.sync.outputs.version }}
          # beforePack fails the build when the template manifest is missing.
          ORCA_REQUIRE_ORCAD_TEMPLATE: '1'
        run: node config/scripts/fork/build-mac-fork.mjs

      - name: Verify the shipped orcad template
        env:
          FORK_VERSION: ${{ needs.sync.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          template='dist/mac-arm64/Blackfish.app/Contents/Resources/orcad-template'
          test -f "$template/orcad-template.json"
          got="$(node -p "require(process.argv[1]).version" "$PWD/$template/out/package.json")"
          if [ "$got" != "$FORK_VERSION" ]; then
            echo "::error::Shipped orcad template has version $got, expected $FORK_VERSION"
            exit 1
          fi
          for target in darwin-arm64 linux-x64-glibc linux-arm64-glibc; do
            test -d "$template/targets/$target" || { echo "::error::orcad template lacks $target"; exit 1; }
          done
          ls "$template/targets"

      # Squirrel.Mac installs an update only when it meets the running app's designated requirement.
      - name: Verify the signature
        shell: bash
        run: |
          set -euo pipefail
          app='dist/mac-arm64/Blackfish.app'
          codesign --verify --deep --strict "$app"
          requirement="$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')"
          echo "designated => $requirement"
          # A self-signed certificate is its own root, so codesign writes "root" where a CA chain says "leaf".
          root="identifier \"com.saltyfireball.orca\" and certificate root = H\"$FORK_MAC_CERT_SHA1\""
          leaf="identifier \"com.saltyfireball.orca\" and certificate leaf = H\"$FORK_MAC_CERT_SHA1\""
          if [ "$requirement" != "$root" ] && [ "$requirement" != "$leaf" ]; then
            echo "::error::Expected designated requirement: $root"
            exit 1
          fi

      - name: Verify the built version
        env:
          FORK_VERSION: ${{ needs.sync.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          feed="$(sed -n 's/^version: //p' dist/latest-mac.yml)"
          app="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/mac-arm64/Blackfish.app/Contents/Info.plist')"
          if [ "$feed" != "$FORK_VERSION" ] || [ "$app" != "$FORK_VERSION" ]; then
            echo "::error::Expected $FORK_VERSION, latest-mac.yml has $feed and the app has $app"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_VERSION: ${{ needs.sync.outputs.version }}
          UPSTREAM_TAG: ${{ needs.sync.outputs.upstream_tag }}
          SHA: ${{ needs.sync.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${FORK_VERSION}"
          shopt -s nullglob
          # The zip is "Blackfish-<version>-arm64-mac.zip", as latest-mac.yml names it. Spaces become
          # dashes, as in the feed, should the product name ever hold one.
          mkdir -p release-assets
          for file in dist/*.dmg dist/*.zip dist/latest-mac.yml; do
            name="$(basename "$file")"
            cp "$file" "release-assets/${name// /-}"
          done
          assets=(release-assets/*)
          if [ "${#assets[@]}" -lt 3 ]; then
            echo "::error::Expected a dmg, a zip and latest-mac.yml in dist/"
            ls -la dist || true
            exit 1
          fi
          while read -r url; do
            [ -f "release-assets/$url" ] || { echo "::error::latest-mac.yml names missing asset $url"; exit 1; }
          done < <(sed -n 's/^ *- url: //p' release-assets/latest-mac.yml)
          gh release create "$tag" "${assets[@]}" \
            -R "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Blackfish $FORK_VERSION" \
            --notes "Self-signed macOS build of upstream $UPSTREAM_TAG plus the fork patches in FORK.md."

  # Every run, whatever failed, publishes status.json on the status branch (read by the app's
  # update check) and states the outcome, with resync commands, in the run summary. GITHUB_TOKEN
  # suffices: that branch's tree holds no workflow files, and token pushes start no workflows.
  status:
    needs: [sync, orcad-template, orcad-template-fork, build-mac]
    if: always() && github.repository == 'saltyfireball/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Read the last published status
        shell: bash
        run: bash config/scripts/fork/fork-sync.sh previous >"$RUNNER_TEMP/previous-status.json"

      - name: Compose the sync status and the run summary
        id: compose
        shell: bash
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
          BUILD_RESULTS: ${{ needs.orcad-template.result }} ${{ needs.orcad-template-fork.result }} ${{ needs.build-mac.result }}
          LATEST: ${{ needs.sync.outputs.upstream_tag }}
          LATEST_SHA: ${{ needs.sync.outputs.latest_sha }}
          BASE_SHA: ${{ needs.sync.outputs.base_sha }}
          BASE_VERSION: ${{ needs.sync.outputs.base_version }}
          BASE_SOURCE: ${{ needs.sync.outputs.base_source }}
          DETECT_STATE: ${{ needs.sync.outputs.detect_state }}
          DETECT_ERROR: ${{ needs.sync.outputs.detect_error }}
          OLD_MAIN: ${{ needs.sync.outputs.old_main }}
          CHANGED: ${{ needs.sync.outputs.changed }}
          CONFLICT: ${{ needs.sync.outputs.conflict }}
          CONFLICTS: ${{ needs.sync.outputs.conflicts }}
          UNSIGNED: ${{ needs.sync.outputs.unsigned }}
        run: node config/scripts/fork/fork-sync-status.mjs "$RUNNER_TEMP/status.json" "$RUNNER_TEMP/previous-status.json"

      - name: Publish the sync status
        shell: bash
        env:
          STATUS_FILE: ${{ runner.temp }}/status.json
